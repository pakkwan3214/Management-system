services:
  postgres:
    image: postgres:16
    container_name: dealership-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dealership_dev
    ports:
      - "5432:5432"
    volumes:
      - dealership_postgres_data:/var/lib/postgresql/data

volumes:
  dealership_postgres_data:
